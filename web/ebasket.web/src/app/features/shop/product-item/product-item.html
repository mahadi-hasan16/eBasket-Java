@if(product){
 <div class="bg-neutral-primary-soft p-4 border border-default rounded-base shadow-xs">
      <mat-card appearance="raised" routerLink="/shop/{{product.id}}" class="fixed-card">
        <img class="rounded-base w-full h-48 object-cover" src="{{product.imageUrl}}" alt="Image of {{product.name}}">
        <mat-card-content>
          <h2 class="mt-2 mb-1 text-lg font-semibold tracking-tight text-heading">{{product.name}}</h2>
          <p class="font-light">{{product.price | currency}}</p>
        </mat-card-content>
        <mat-card-actions>
          <button mat-stroked-button class="w-full">
            <mat-icon>add_shopping_cart</mat-icon>
            Add to cart
          </button>
        </mat-card-actions>
      </mat-card>
    </div>
}
@else {
<p>Product Loading ......</p>
}
