<header [class.sticky]="config().sticky" [class.bg-transparent]="config().transparent"
  class="bg-white shadow-md transition-all duration-200">

  <div class="container mx-auto px-4">

    <!-- Grid Container -->
    <div class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center space-x-2 text-blue-600 hover:text-blue-700">
        <img class="logo" src={{ICONS.LOGO}} alt="Logo" />
      </a>

      <!-- Categories Navigation -->
      @if (config().showCategory) {
      <nav class="hidden md:flex items-center space-x-6 ml-8">
        <a routerLink="/products" class="text-gray-600 hover:text-blue-600 transition-colors">
          Products
        </a>
        <a routerLink="/categories/electronics" class="text-gray-600 hover:text-blue-600 transition-colors">
          Electronics
        </a>
        <a routerLink="/categories/fashion" class="text-gray-600 hover:text-blue-600 transition-colors">
          Fashion
        </a>
      </nav>
      }

      <!-- Search Bar -->
      @if (config().showSearch) {
      <div class="flex-1 max-w-xl mx-8">
        <div class="relative">
          <input type="text" placeholder="Search products..." class="w-full px-4 py-2 pl-10 pr-12 rounded-lg border border-gray-300 
                     focus:ring-2 focus:ring-blue-500 focus:border-transparent
                     focus:outline-none transition-all" [value]="searchQuery()"
            (input)="searchQuery.set($any($event.target).value)" (keyup.enter)="onSearch()" #searchInput />
          <!-- Search Icon -->
          <div class="absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400">
          </div>
          <!-- Search Button -->
          <button (click)="onSearch()" class="absolute right-2 top-1/2 transform -translate-y-1/2 
                     px-3 py-1 bg-blue-400 text-white rounded-md 
                     hover:bg-blue-700 transition-colors">
            Search
            <img class="icon" src={{ICONS.SEARCH}} alt="Search Icon">
          </button>
        </div>
      </div>
      }

      @if (config().showNotificationBell) {
      <img class="icon" src={{ICONS.NOTIFICATION_BELL}} alt="Notification Bell">
      }

      <!-- User Actions -->
      <div class="flex items-center space-x-4">

        <!-- Cart -->
        <a routerLink="/cart" class="relative p-2 text-gray-600 hover:text-blue-600">
          <img class="icon" src={{ICONS.SHOPPING_CART}} alt="Shopping Cart">
          @if (cartItemCount() > 0) {
          <span class="absolute -top-1 -right-1 bg-red-500 text-white 
                     text-xs rounded-full w-5 h-5 flex items-center justify-center">
            {{ cartItemCount() }}
          </span>
          }
        </a>

        <!-- User Menu -->
        <div class="relative">
          <button (click)="toggleMenu()" class="flex items-center space-x-2 p-2 rounded-lg 
                   hover:bg-gray-100 transition-colors">
            @if (user()) {
            <!-- Logged In -->
            <div class="w-8 h-8 bg-blue-100 text-blue-600 rounded-full 
                          flex items-center justify-center font-semibold">
              {{ user()?.firstName?.charAt(0) || 'U' }}
            </div>
            <span class="hidden md:inline text-gray-700">
              {{ user()?.firstName }}
            </span>
            } @else {
            <!-- Logged Out -->
            <div class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center">
              <img class="icon" src={{ICONS.TEST_ACCOUNT}} alt="">
            </div>
            <span class="hidden md:inline text-gray-700">Sign In</span>
            }
            <!-- Dropdown Arrow -->
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          <!-- Dropdown Menu -->
          @if (isMenuOpen()) {
          <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg 
                     border border-gray-200 z-50">
            @if (user()) {
            <!-- Logged In Menu -->
            <a routerLink="/profile" class="block px-4 py-3 hover:bg-gray-50 transition-colors">
              My Profile
            </a>
            <a routerLink="/orders" class="block px-4 py-3 hover:bg-gray-50 transition-colors">
              My Orders
            </a>
            <a routerLink="/wishlist" class="block px-4 py-3 hover:bg-gray-50 transition-colors">
              Wishlist
            </a>
            <hr class="border-gray-200 my-1">
            <button (click)="onLogout()" class="w-full text-left px-4 py-3 text-red-600 
                         hover:bg-gray-50 transition-colors">
              Sign Out
            </button>
            } @else {
            <!-- Logged Out Menu -->
            <a routerLink="/auth/login" class="block px-4 py-3 hover:bg-gray-50 transition-colors">
              Sign In
            </a>
            <a routerLink="/auth/register" class="block px-4 py-3 hover:bg-gray-50 transition-colors">
              Create Account
            </a>
            }
          </div>
          }
        </div>

      </div>

    </div>
  </div>
</header>
